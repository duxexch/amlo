# ═══════════════════════════════════════════════════════
# Coturn TURN/STUN Server — Ablox WebRTC NAT Traversal
# ═══════════════════════════════════════════════════════
# Enables WebRTC connections through restrictive NATs/firewalls.
# Used by LiveKit for media relay when direct P2P fails.

# ── Server Identity ──
realm=mrco.live
server-name=ablox-turn

# ── Listening Ports ──
listening-port=3478
# TLS listener disabled unless certificate files are mounted.

# ── Media Relay Ports ──
min-port=49152
max-port=49999

# ── Auth (use static-auth-secret for LiveKit HMAC) ──
use-auth-secret
# static-auth-secret is injected by docker-compose command at runtime.

# The public IP is injected at runtime via:
#   --external-ip=$TURN_EXTERNAL_IP
# Keep TURN_EXTERNAL_IP set in .env on production hosts.

# ── Logging ──
log-file=stdout
verbose

# ── TLS (TURNS on port 443 for restrictive networks) ──
# Uncomment and mount certs to enable TURNS:
# tls-listening-port=443
# cert=/etc/ssl/certs/turn-cert.pem
# pkey=/etc/ssl/private/turn-key.pem

# ── Performance ──
relay-threads=0
max-bps=3145728
user-quota=20
total-quota=3000

# ── Security ──
# Restrict peer addresses (no loopback relay)
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# ── Protocol ──
fingerprint
no-cli
