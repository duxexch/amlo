# ═══════════════════════════════════════════════════════
# LiveKit Server Configuration — Ablox Live Streaming
# Minimal + Compatible Config (works with all versions)
# Advanced settings via docker-compose environment variables
# ═══════════════════════════════════════════════════════

# ── Basic Server Settings ──
port: 7880
bind_addresses:
  - 0.0.0.0

# ── Keys (matches LIVEKIT_API_KEY and LIVEKIT_API_SECRET env) ──
keys:
  ablox_livekit_key: ablox_livekit_secret_2026_secure

# ── RTC (WebRTC) Configuration ──
rtc:
  use_external_ip: true
  port_range_start: 50000
  port_range_end: 50100
  # TCP fallback for restrictive networks
  tcp_port: 7881

# ── Room Settings ──
room:
  empty_timeout: 300      # Auto-cleanup after 5 minutes
  max_participants: 500   # Max concurrent users per room
  auto_create: true       # Create rooms on first join

# ── Logging ──
logging:
  level: info
  sample: false

# ────────────────────────────────────────────────────────
# IMPORTANT: ICE/STUN/TURN servers, codecs, and advanced
# settings are configured via environment variables in
# docker-compose.yml to ensure compatibility with all
# LiveKit versions. See docker-compose.yml for details.
# ────────────────────────────────────────────────────────
